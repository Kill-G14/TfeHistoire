<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F5E59" />

    <!-- Base URL de la SPA selon l'environnement (insérée par le DOM : plus de document.write bloquant) -->
    <script>
      (function () {
        const hostname = window.location.hostname;
        const isProduction =
          hostname === "memoriaeventia.com" ||
          hostname === "www.memoriaeventia.com";
        const base = document.createElement("base");
        base.href = isProduction ? "/" : "/tfeHistoire/";
        document.head.appendChild(base);
      })();
    </script>

    <link
      rel="icon"
      type="image/png"
      href="assets/images/MemoriaEventiaIcon-192.png"
    />
    <link
      rel="apple-touch-icon"
      href="assets/images/MemoriaEventiaIcon-192.png"
    />
    <title id="pageTitle">
      MemoriaEventia - Événements historiques d'Europe
    </title>
    <meta
      name="description"
      id="pageDescription"
      content="Découvrez et participez aux plus grandes célébrations historiques à travers l'Europe"
    />

    <!-- Référencement et partage : valeurs par défaut, le routeur les met à jour à chaque page -->
    <link rel="canonical" id="pageCanonical" href="https://memoriaeventia.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MemoriaEventia" />
    <meta property="og:locale" content="fr_BE" />
    <meta
      property="og:title"
      id="ogTitle"
      content="MemoriaEventia - Événements historiques d'Europe"
    />
    <meta
      property="og:description"
      id="ogDescription"
      content="Découvrez et participez aux plus grandes célébrations historiques à travers l'Europe"
    />
    <meta property="og:url" id="ogUrl" content="https://memoriaeventia.com/" />
    <meta
      property="og:image"
      id="ogImage"
      content="https://memoriaeventia.com/assets/images/MemoriaEventiaShare-1200x630.png"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/custom.css?v=1.6.0" />
  </head>

  <body>
    <!-- Lien d'accès rapide au contenu (clavier et lecteurs d'écran) -->
    <a class="skip-link visually-hidden-focusable" href="#app">
      Aller au contenu
    </a>

    <!-- Navbar persistante -->
    <div id="header"></div>

    <!-- Conteneur principal pour les vues -->
    <main id="app" tabindex="-1"></main>

    <!-- Footer persistant -->
    <div id="footer"></div>

    <!-- Mobile Navigation -->
    <div id="mobileNav"></div>

    <!-- Toast Container -->
    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toastContainer"
    ></div>

    <!-- Bootstrap Bundle JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Leaflet n'est plus chargé ici : la page carte le charge à la demande (utils/leafletLoader.js) -->

    <!-- Application principale -->
    <script type="module" src="assets/js/app.js?v=1.0.1"></script>
  </body>
</html>
