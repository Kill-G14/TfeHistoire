<template id="calendarView">
  <div class="container py-4 py-md-5 calendar-page" style="max-width: 1200px">
    <!-- En-tête de la page -->
    <div class="text-center mb-4">
      <h1 class="page-title mb-2">Calendrier des Événements</h1>
      <p class="text-muted mb-0">Découvrez tous les événements à venir</p>
    </div>

    <!-- Barre d'outils : navigation, mois courant, affichage -->
    <div class="calendar-toolbar mb-3">
      <div class="calendar-toolbar-nav">
        <button
          type="button"
          class="btn btn-outline-primary calendar-icon-btn"
          id="prevMonth"
          aria-label="Mois précédent"
        >
          <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="btn btn-outline-primary calendar-icon-btn"
          id="nextMonth"
          aria-label="Mois suivant"
        >
          <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
        <button type="button" class="btn btn-outline-primary" id="todayBtn">
          Aujourd'hui
        </button>
      </div>

      <h2 class="calendar-title mb-0" id="currentMonthYear" aria-live="polite">
        Mois
      </h2>

      <div
        class="btn-group calendar-view-switch"
        role="group"
        aria-label="Mode d'affichage"
      >
        <button
          type="button"
          class="btn btn-outline-primary"
          id="viewGridBtn"
          aria-pressed="true"
        >
          <i class="bi bi-calendar3 me-1" aria-hidden="true"></i>Mois
        </button>
        <button
          type="button"
          class="btn btn-outline-primary"
          id="viewAgendaBtn"
          aria-pressed="false"
        >
          <i class="bi bi-list-ul me-1" aria-hidden="true"></i>Agenda
        </button>
      </div>
    </div>

    <!-- Résumé du mois et prochain événement -->
    <div class="calendar-summary mb-3">
      <span id="calendarSummary" class="text-muted"></span>
      <button
        type="button"
        class="btn btn-link btn-sm p-0 d-none"
        id="nextEventBtn"
      ></button>
    </div>

    <!-- Catégories : légende et filtre à la fois -->
    <div
      class="calendar-legend mb-3"
      id="calendarLegend"
      role="group"
      aria-label="Filtrer par catégorie"
    ></div>

    <!-- Vue mensuelle -->
    <div class="calendar-container calendar-fade" id="calendarGridView">
      <div class="calendar-header" aria-hidden="true">
        <div class="calendar-day-name">Lun</div>
        <div class="calendar-day-name">Mar</div>
        <div class="calendar-day-name">Mer</div>
        <div class="calendar-day-name">Jeu</div>
        <div class="calendar-day-name">Ven</div>
        <div class="calendar-day-name">Sam</div>
        <div class="calendar-day-name">Dim</div>
      </div>
      <div class="calendar-body" id="calendarDays"></div>
    </div>

    <!-- Vue agenda (liste par jour) -->
    <div class="calendar-agenda calendar-fade d-none" id="calendarAgendaView"></div>

    <!-- Bouton retour -->
    <div class="text-center mt-5">
      <a href="./" data-link class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retour aux événements
      </a>
    </div>
  </div>
</template>

<!-- Fenêtre des événements d'un jour -->
<template id="dayEventsModal">
  <div
    class="modal fade"
    id="dayEventsModalElement"
    tabindex="-1"
    aria-labelledby="dayEventsModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="dayEventsModalLabel">
            Événements du <span id="modalDate"></span>
          </h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Fermer"
          ></button>
        </div>
        <div class="modal-body">
          <div id="modalEventsList"></div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Fermer
          </button>
        </div>
      </div>
    </div>
  </div>
</template>
