<template id="headerTemplate">
  <header class="header">
    <div class="container py-3">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-4">
          <a
            href="./"
            data-link
            class="header-logo d-flex align-items-center gap-2"
          >
            <img
              src="./assets/images/MemoriaEventiaLogo-360.png"
              width="360"
              height="240"
              alt="MemoriaEventia Logo"
              class="header-logo-img"
              fetchpriority="high"
            />
          </a>

          <nav class="d-none d-md-flex align-items-center gap-3">
            <a href="./" data-link class="nav-link" id="navHome">Événements</a>
            <a href="calendar" data-link class="nav-link" id="navCalendar"
              >Calendrier</a
            >
            <a href="map" data-link class="nav-link" id="navMap">Carte</a>
          </nav>
        </div>

        <div class="d-flex align-items-center gap-2" id="headerActions">
          <!-- Actions injectées dynamiquement -->
        </div>
      </div>
    </div>
  </header>
</template>

<template id="headerActionsLoggedIn">
  <button
    class="btn header-icon-btn header-icon-btn-profile"
    id="btnProfile"
    title="Mon profil"
    aria-label="Mon profil"
  >
    <i class="bi bi-person"></i>
  </button>
  <button
    class="btn header-icon-btn header-icon-btn-logout"
    id="btnLogout"
    title="Se déconnecter"
    aria-label="Se déconnecter"
  >
    <i class="bi bi-box-arrow-right"></i>
  </button>
</template>

<template id="headerActionsLoggedOut">
  <button
    class="btn btn-primary header-login-btn d-flex align-items-center gap-2"
    id="btnLogin"
  >
    <i class="bi bi-box-arrow-in-right"></i>
    Connexion
  </button>
</template>
