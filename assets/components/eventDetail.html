<template id="eventDetailTemplate">
  <div
    class="eventDetail"
    id="eventDetailOverlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="detailTitle"
  >
    <div class="eventDetail-content">
      <div class="position-relative">
        <img
          src=""
          alt=""
          class="w-100 eventDetail-image rounded-top"
          id="detailImage"
          loading="lazy"
        />
        <button
          type="button"
          class="btn-favorite"
          id="detailFavoriteBtn"
          aria-label="Ajouter aux favoris"
          aria-pressed="false"
        >
          <i class="bi bi-heart"></i>
        </button>
        <button
          type="button"
          class="btn btn-light position-absolute top-0 end-0 m-3"
          id="closeDetailBtn"
          aria-label="Fermer le détail de l'événement"
        >
          <i class="bi bi-x-lg"></i>
        </button>
        <span
          class="badge bg-primary position-absolute bottom-0 start-0 m-3 px-3 py-2"
          id="detailCategory"
        ></span>
      </div>

      <div class="eventDetail-body">
        <div class="mb-4">
          <h2 class="text-primary mb-2" id="detailTitle"></h2>
          <p class="eventDetail-organizer mb-2" id="detailOrganizer"></p>
          <p class="mb-0" id="detailDescription"></p>
        </div>

        <!-- Infos clés en grille : 2 colonnes dès le mobile -->
        <div class="row g-2 g-md-3 mb-4">
          <div class="col-6">
            <div class="eventDetail-info-box">
              <i class="bi bi-calendar3 text-accent"></i>
              <div>
                <div class="eventDetail-info-label">Date</div>
                <div class="eventDetail-info-value" id="detailDate"></div>
              </div>
            </div>
          </div>

          <div class="col-6">
            <div class="eventDetail-info-box">
              <i class="bi bi-clock text-accent"></i>
              <div>
                <div class="eventDetail-info-label">Heure</div>
                <div class="eventDetail-info-value" id="detailTime"></div>
              </div>
            </div>
          </div>

          <div class="col-6">
            <div class="eventDetail-info-box">
              <i class="bi bi-geo-alt text-accent"></i>
              <div>
                <div class="eventDetail-info-label">Lieu</div>
                <div class="eventDetail-info-value" id="detailLocation"></div>
              </div>
            </div>
          </div>

          <div class="col-6">
            <div class="eventDetail-info-box">
              <i class="bi bi-people text-accent"></i>
              <div>
                <div class="eventDetail-info-label">Places disponibles</div>
                <div class="eventDetail-info-value" id="detailTickets"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Réservation : collée en bas de l'écran sur mobile (voir custom.css) -->
        <div class="eventDetail-reservation" id="reservationSection">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="eventDetail-reservation-label">Prix par place</span>
            <span class="fw-bold text-primary" id="detailPrice"></span>
          </div>

          <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
            <div
              class="d-flex align-items-center gap-2"
              role="group"
              aria-label="Nombre de places"
            >
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                id="decreaseQty"
                aria-label="Diminuer le nombre de places"
              >
                <i class="bi bi-dash-lg"></i>
              </button>
              <span class="eventDetail-quantity" id="quantity" aria-live="polite"
                >1</span
              >
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                id="increaseQty"
                aria-label="Augmenter le nombre de places"
              >
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>

            <div class="text-end">
              <div class="eventDetail-reservation-label">Total</div>
              <div class="eventDetail-total text-primary" id="totalPrice"></div>
            </div>
          </div>

          <button
            type="button"
            class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2"
            id="reserveBtn"
          >
            <i class="bi bi-ticket-perforated"></i>
            <span id="reserveBtnLabel">Réserver maintenant</span>
          </button>
          <p class="form-text mt-2 mb-0 d-none" id="paymentNotice">
            Le paiement est encaissé directement par l'organisateur :
            MemoriaEventia ne perçoit aucun montant.
          </p>
        </div>
      </div>
    </div>
  </div>
</template>
